<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<rect width="1200" height="900" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold">Coffee Kiosk System - Layered Architecture</text>
<g fill="#f4f4f4" stroke="#555" stroke-width="2">
<rect x="90" y="75" width="1020" height="160"/><rect x="90" y="275" width="1020" height="390"/><rect x="90" y="705" width="1020" height="150"/>
</g>
<g font-family="Arial" font-size="20" font-weight="bold"><text x="110" y="105">Presentation Layer</text><text x="110" y="305">Business Layer</text><text x="110" y="735">Data Layer</text></g>
<g fill="#dce9f8" stroke="#5279a8" stroke-width="2">
<rect x="380" y="130" width="440" height="75"/><rect x="300" y="355" width="600" height="95"/><rect x="155" y="515" width="250" height="90"/><rect x="795" y="515" width="250" height="90"/><rect x="425" y="755" width="350" height="70"/>
</g>
<g font-family="Arial" font-size="19" text-anchor="middle" fill="#111">
<text x="600" y="160">«component»</text><text x="600" y="188">User Interface Component</text>
<text x="600" y="392">«component»</text><text x="600" y="423">Order Manager Component</text>
<text x="280" y="550">«component»</text><text x="280" y="580">Payment Service Component</text>
<text x="920" y="550">«component»</text><text x="920" y="580">Receipt Printer Component</text>
<text x="600" y="783">«component»</text><text x="600" y="810">Menu Database Component</text>
</g>
<g stroke="#222" stroke-width="3" fill="none"><path d="M600 205 V355"/><path d="M280 450 V515"/><path d="M920 450 V515"/><path d="M600 450 V755"/></g>
<g font-family="Arial" font-size="15" fill="#111">
<text x="620" y="250">IOrder: selectCoffee(type, size), submitOrder()</text><text x="620" y="270">orderSummary, orderStatus — API call</text>
<text x="105" y="480">IPayment: processPayment(amount, cardData)</text><text x="105" y="500">approved / declined — API call</text>
<text x="810" y="480">IReceipt: printReceipt(orderDetails)</text><text x="810" y="500">printStatus — Hardware interface</text>
<text x="620" y="685">IMenuData: getMenu(), getPrice(item)</text><text x="620" y="705">items, prices — SQL query</text>
</g>
